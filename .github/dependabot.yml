version: 2
updates:
  # Version updates only; GitHub security PRs target the default branch instead.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 1
    groups:
      compatible-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(ci)'
