name: Verify Vercel Production

on:
  deployment_status:

concurrency:
  group: vercel-production-${{ github.event.deployment.id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: vercel-production-smoke
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
       github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployment URL
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo "Vercel did not provide a valid HTTPS deployment URL." >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --max-time 30 \
            "$DEPLOYMENT_URL" >/dev/null
