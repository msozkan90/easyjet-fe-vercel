name: Frontend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    # Pin the stable image so a future ubuntu-latest migration cannot change CI unexpectedly.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: yarn

      - name: Test dependency security policy
        run: node --test .github/scripts/*.test.mjs

      - name: Check production dependency security
        run: node .github/scripts/check-dependency-audit.mjs

      - name: Scan repository history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Security and API client regression tests
        run: yarn test:security

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.easyjetconnect.shop/api
        run: yarn build
